<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Statistiche · La sala giochi</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#120a24;color:#fff;font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:16px 14px 60px}
h1{font-size:22px;margin:4px 0 14px;color:#ffd54f}h2{font-size:17px;margin:26px 0 8px;color:#ffd54f}
.wrap{max-width:1000px;margin:0 auto}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.card{background:#2b0f45;border:2px solid #ffd54f55;border-radius:12px;padding:12px;text-align:center}
.card b{display:block;font-size:28px;color:#ffe066}.card span{font-size:13px;opacity:.85}
.sc{overflow-x:auto;border:1px solid #ffffff22;border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:640px}th,td{padding:8px 10px;text-align:left;border-bottom:1px solid #ffffff18;white-space:nowrap}
th{background:#2b0f45;color:#ffd54f;font-size:13px;position:sticky;top:0}td.n,th.n{text-align:right}
tr.off td{opacity:.55}.ok{color:#7be07b}.no{color:#ffb74d}.bad{color:#ff7b7b}
.bars{display:flex;align-items:flex-end;gap:5px;height:150px;padding:8px;background:#2b0f45;border-radius:10px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:11px}
.bar i{display:block;width:100%;background:linear-gradient(#ffd54f,#ff6a1a);border-radius:4px 4px 0 0;min-height:2px}.bar b{font-size:11px}.bar span{opacity:.7;font-size:10px}
small{opacity:.7}a{color:#ffe066}
.note{background:#2b0f45;border-radius:10px;padding:10px 12px;margin-top:14px;font-size:13px;opacity:.9}
</style></head><body><div class="wrap">
<h1>📊 LA SALA GIOCHI · statistiche comuni</h1>
<div id="body">Carico…</div></div>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
const PIN="capone";
const FB_CFG={apiKey:"AIzaSyCHBGgiKfQUwrtlX_jFMoySt9yw1naf7AI",authDomain:"super-capone.firebaseapp.com",databaseURL:"https://super-capone-default-rtdb.europe-west1.firebasedatabase.app",projectId:"super-capone",storageBucket:"super-capone.firebasestorage.app",messagingSenderId:"234467270209",appId:"1:234467270209:web:b4ccb22824177d5f5e70c0"};
/* Un gioco = una riga. path = cartella nel database (arcade/<nome>). */
const GAMES=[
 {n:"Sciarra",p:"arcade/sciarra"},
 {n:"L'acqua di Giurgenti",p:"arcade/acquagiurgenti"},
 {n:"Munnizza",p:"arcade/munnizza"},
 {n:"Girgenti Roads",p:"arcade/girgentiroads"},
 {n:"Super Capone",p:"arcade/supercapone",u:"https://supercapone.ilcaponequiz.win/?stats"},
 {n:"Formula Anziani",p:"arcade/formulaanziani"},
 {n:"Salsa e maionese",p:"arcade/salsaemaionese"}
];
const $=id=>document.getElementById(id),esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtN=n=>(n||0).toLocaleString("it-IT"),DAY=864e5;
const fmtD=t=>t?new Date(t).toLocaleString("it-IT",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):"—";
async function run(){
  if(prompt("PIN delle statistiche:")!==PIN){$("body").innerHTML="<h2>Accesso negato</h2>";return}
  let db;try{firebase.initializeApp(FB_CFG);db=firebase.database()}catch(e){$("body").textContent="Database non raggiungibile.";return}
  const t0=new Date().setHours(0,0,0,0);
  const res=await Promise.all(GAMES.map(async g=>{
    const r={g,ok:false,err:null,visits:0,plays:0,list:[]};
    try{
      const [s,p]=await Promise.all([db.ref(g.p+"/stats").once("value"),db.ref(g.p+"/plays").limitToLast(2000).once("value")]);
      const sv=s.val()||{},pv=Object.values(p.val()||{});
      r.visits=sv.visits||0;r.plays=sv.plays||pv.length;r.list=pv;r.ok=!!(s.exists()||p.exists());
    }catch(e){r.err=String(e&&e.message||e)}
    return r;
  }));
  const act=res.filter(r=>r.ok);
  const today=r=>r.list.filter(x=>x.t>=t0).length,week=r=>r.list.filter(x=>x.t>=Date.now()-7*DAY).length;
  const names=r=>new Set(r.list.map(x=>String(x.n||"").trim().toLowerCase()).filter(Boolean)).size;
  const last=r=>r.list.reduce((m,x)=>Math.max(m,x.t||0),0);
  const tot=f=>act.reduce((a,r)=>a+f(r),0);
  const days=[];for(let i=13;i>=0;i--){const a=t0-i*DAY;days.push({d:new Date(a).toLocaleDateString("it-IT",{day:"2-digit",month:"2-digit"}),c:act.reduce((s,r)=>s+r.list.filter(x=>x.t>=a&&x.t<a+DAY).length,0)})}
  const mx=Math.max(1,...days.map(d=>d.c)),card=(b,s)=>`<div class="card"><b>${b}</b><span>${s}</span></div>`;
  const rows=res.map(r=>{
    const st=r.err?`<span class="bad">errore regole</span>`:r.ok?`<span class="ok">✅ attivo</span>`:`<span class="no">⏳ nessun dato</span>`;
    const nm=r.g.u?`<a href="${r.g.u}" target="_blank" rel="noopener">${esc(r.g.n)}</a>`:esc(r.g.n);
    return `<tr class="${r.ok?"":"off"}"><td>${nm}</td><td class="n">${fmtN(r.visits)}</td><td class="n">${fmtN(r.plays)}</td><td class="n">${r.ok?today(r):"—"}</td><td class="n">${r.ok?week(r):"—"}</td><td class="n">${r.ok?names(r):"—"}</td><td>${r.ok?fmtD(last(r)):"—"}</td><td>${st}</td></tr>`}).join("");
  const inattivi=res.filter(r=>!r.ok&&!r.err).map(r=>r.g.n),errori=res.filter(r=>r.err);
  $("body").innerHTML=`<div class="cards">${card(fmtN(tot(r=>r.visits)),"visite totali")}${card(fmtN(tot(r=>r.plays)),"partite iniziate")}${card(tot(today),"partite oggi")}${card(tot(week),"partite ultimi 7 giorni")}${card(act.length+" / "+GAMES.length,"giochi con statistiche")}</div>
  <h2>🎮 Giochi a confronto</h2><div class="sc"><table><tr><th>Gioco</th><th class="n">Visite</th><th class="n">Partite</th><th class="n">Oggi</th><th class="n">7 giorni</th><th class="n">Giocatori</th><th>Ultima partita</th><th>Stato</th></tr>${rows}</table></div>
  <h2>📈 Partite al giorno, tutti i giochi (14 giorni)</h2><div class="bars">${days.map(d=>`<div class="bar"><b>${d.c}</b><i style="height:${d.c/mx*100}%"></i><span>${d.d}</span></div>`).join("")}</div>
  <div class="note">“Giocatori” e i dati per giorno si basano sulle ultime 2000 partite di ogni gioco; visite e partite totali sono i contatori completi.${inattivi.length?"<br><br>Senza dati: "+esc(inattivi.join(", "))+" (il gioco non conta ancora le visite, oppure nessuno l'ha ancora aperto).":""}${errori.length?"<br><br>Regole del database da controllare per: "+esc(errori.map(r=>r.g.n).join(", ")):""}</div>`;
}
window.addEventListener("load",run);
</script></body></html>
